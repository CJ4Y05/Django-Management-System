{% extends "base.html" %}

{% block title %}Edit Guardian{% endblock %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4">Edit Guardian</h2>

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" value="{{ form_data.full_name }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Relationship</label>
            <input type="text" name="relationship" class="form-control" value="{{ form_data.relationship }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Contact</label>
            <input type="text" name="contact_info" class="form-control" value="{{ form_data.contact_info }}">
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'guardian_list' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
    </form>

    <div class="mt-3 text-end">
        <a href="{% url 'guardian_delete' guardian_id %}" class="btn btn-danger">Delete</a>
    </div>

</div>
{% endblock %}
