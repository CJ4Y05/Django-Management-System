{% extends "base.html" %}

{% block title %}Delete Guardian{% endblock %}

{% block content %}
<h1>Delete Guardian</h1>

<p>
    Are you sure you want to delete
    <strong>{{ guardian.full_name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit" style="background-color:red; color:white;">
        Yes, Delete
    </button>
</form>

<br>
<a href="{% url 'guardian_list' %}">Cancel</a>

{% endblock %}
