{% extends "base.html" %}

{% block title %}Edit Patient{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Patient</h2>

    {% if error_message %}
        <div class="alert alert-danger">{{ error_message }}</div>
    {% endif %}

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">HRN</label>
            <input type="text" name="hrn" class="form-control" value="{{ form_data.hrn }}">
        </div>

        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" name="first_name" class="form-control" value="{{ form_data.first_name }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Middle Name</label>
            <input type="text" name="middle_name" class="form-control" value="{{ form_data.middle_name }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" name="last_name" class="form-control" value="{{ form_data.last_name }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Suffix</label>
            <input type="text" name="suffix" class="form-control" value="{{ form_data.suffix }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Birth Date</label>
            <input type="date" name="birth_date" class="form-control" value="{{ form_data.birth_date }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select">
                <option value="">-- Select --</option>
                <option value="Male" {% if form_data.gender == "Male" %}selected{% endif %}>Male</option>
                <option value="Female" {% if form_data.gender == "Female" %}selected{% endif %}>Female</option>
                <option value="Other" {% if form_data.gender == "Other" %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Civil Status</label>
            <select name="civil_status" class="form-select">
                <option value="">-- Select --</option>
                <option value="Single" {% if form_data.civil_status == "Single" %}selected{% endif %}>Single</option>
                <option value="Married" {% if form_data.civil_status == "Married" %}selected{% endif %}>Married</option>
                <option value="Widowed" {% if form_data.civil_status == "Widowed" %}selected{% endif %}>Widowed</option>
                <option value="Divorced" {% if form_data.civil_status == "Divorced" %}selected{% endif %}>Divorced</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Blood Type</label>
            <select name="blood_type" class="form-select">
                <option value="">-- Select --</option>
                <option value="A+" {% if form_data.blood_type == "A+" %}selected{% endif %}>A+</option>
                <option value="A-" {% if form_data.blood_type == "A-" %}selected{% endif %}>A-</option>
                <option value="B+" {% if form_data.blood_type == "B+" %}selected{% endif %}>B+</option>
                <option value="B-" {% if form_data.blood_type == "B-" %}selected{% endif %}>B-</option>
                <option value="AB+" {% if form_data.blood_type == "AB+" %}selected{% endif %}>AB+</option>
                <option value="AB-" {% if form_data.blood_type == "AB-" %}selected{% endif %}>AB-</option>
                <option value="O+" {% if form_data.blood_type == "O+" %}selected{% endif %}>O+</option>
                <option value="O-" {% if form_data.blood_type == "O-" %}selected{% endif %}>O-</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nationality</label>
            <input type="text" name="nationality" class="form-control" value="{{ form_data.nationality }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Religion</label>
            <input type="text" name="religion" class="form-control" value="{{ form_data.religion }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Occupation</label>
            <input type="text" name="occupation" class="form-control" value="{{ form_data.occupation }}">
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'patient_list' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
    </form>

</div>
{% endblock %}
