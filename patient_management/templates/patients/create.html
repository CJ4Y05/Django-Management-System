{% extends "base.html" %}

{% block title%} Add Patient {% endblock %}

{% block content %}

    <h1>Add New Patient</h1>
    {% if error_message %}
        <p style="color: red;">{{ error_message }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        
        <label>Hospital Registration Number</label>
        <input type="text" name="hrn" value="{{ form_data.hrn }}">

        <label>First Name</label>
        <input type="text" name="first_name" value="{{ form_data.first_name }}">

        <label>Middle Name</label>
        <input type="text" name="middle_name" value="{{ form_data.middle_name }}">

        <label>Last Name</label>
        <input type="text" name="last_name" value="{{ form_data.last_name }}">

        <label>Suffix</label>
        <input type="text" name="suffix" value="{{ form_data.suffix }}">

        <label>Birth Date</label>
        <input type="date" name="birth_date" value="{{ form_data.birth_date }}">

        <label>Gender</label>
        <select name="gender">
            <option value="">-- Select --</option>
            <option value="Male" {% if form_data.gender == "Male" %} selected {% endif %}>Male</option>
            <option value="Female" {% if form_data.gender == "Female" %} selected {% endif %}>Female</option>
            <option value="Other" {% if form_data.gender == "Other" %} selected {% endif %}>Other</option>
        </select>

        <label>Civil Status</label>
        <select name="civil_status">
            <option value="">-- Select --</option>
            <option value="Single" {% if form_data.civil_status == "Single" %} selected {% endif %}>Single</option>
            <option value="Married" {% if form_data.civil_status == "Married" %} selected {% endif %}>Married</option>
            <option value="Widowed" {% if form_data.civil_status == "Widowed" %} selected {% endif %}>Widowed</option>
            <option value="Divorced" {% if form_data.civil_status == "Divorced" %} selected {% endif %}>Divorced</option>
        </select>

        <label>Blood Type</label>
        <select name="blood_type">
            <option value="">-- Select --</option>
            <option value="A+" {% if form_data.blood_type == "A+" %} selected {% endif %}>A+</option>
            <option value="A-" {% if form_data.blood_type == "A-" %} selected {% endif %}>A-</option>
            <option value="B+" {% if form_data.blood_type == "B+" %} selected {% endif %}>B+</option>
            <option value="B-" {% if form_data.blood_type == "B-" %} selected {% endif %}>B-</option>
            <option value="AB+" {% if form_data.blood_type == "AB+" %} selected {% endif %}>AB+</option>
            <option value="AB-" {% if form_data.blood_type == "AB-" %} selected {% endif %}>AB-</option>
            <option value="O+" {% if form_data.blood_type == "O+" %} selected {% endif %}>O+</option>
            <option value="O-" {% if form_data.blood_type == "O-" %} selected {% endif %}>O-</option>
        </select>

        <label>Nationality</label>
        <input type="text" name="nationality" value="{{ form_data.nationality }}">

        <label>Religion</label>
        <input type="text" name="religion" value="{{ form_data.religion }}">

        <label>Occupation</label>
        <input type="text" name="occupation" value="{{ form_data.occupation }}">


        <button type="submit"> Save Patient</button>
    </form>

    <a href="{% url 'patient_list' %}">Go Back</a> 

{% endblock %}
