{% extends "base.html" %}

{% block title %}Edit Emergency Contact{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Emergency Contact</h2>

    {% if error_message %}
        <div class="alert alert-danger">{{ error_message }}</div>
    {% endif %}

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Patient ID</label>
            <input type="number" name="patient_id" class="form-control" value="{{ form_data.patient_id }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ form_data.name }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Relationship</label>
            <input type="text" name="relationship" class="form-control" value="{{ form_data.relationship }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" name="contact_number" class="form-control" value="{{ form_data.contact_number }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Next of Kin</label>
            <select name="is_next_of_kin" class="form-select">
                <option value="">-- Select --</option>
                <option value="1" {% if form_data.is_next_of_kin|stringformat:"s" == "1" %}selected{% endif %}>Yes</option>
                <option value="0" {% if form_data.is_next_of_kin|stringformat:"s" == "0" %}selected{% endif %}>No</option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'emergencycontact_list' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
    </form>

    <div class="mt-3 text-end">
        <a href="{% url 'emergencycontact_delete' contact_id %}" class="btn btn-danger">Delete Contact</a>
    </div>
</div>
{% endblock %}
