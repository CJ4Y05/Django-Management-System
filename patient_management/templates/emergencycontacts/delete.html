{% extends "base.html" %}

{% block title %}Delete Emergency Contact{% endblock %}

{% block content %}

<h1>Delete Emergency Contact</h1>

<p>
    Are you sure you want to delete
    <strong>{{ contact.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit" style="background-color:red; color:white;">
        Yes, Delete
    </button>
</form>

<br>
<a href="{% url 'emergencycontact_list' %}">Cancel</a>

{% endblock %}
