{% extends "base.html" %}

{% block title %}Edit Admission{% endblock %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4">Edit Admission</h2>

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Case No</label>
            <input type="text" name="case_no" class="form-control" value="{{ form_data.case_no }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Diagnosis</label>
            <textarea name="initial_diagnosis" class="form-control">{{ form_data.initial_diagnosis }}</textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'admission_list' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
    </form>

    <div class="mt-3 text-end">
        <a href="{% url 'admission_delete' admission_id %}" class="btn btn-danger">Delete</a>
    </div>

</div>
{% endblock %}
