{% extends "base.html" %}

{% block title %}Edit Admission{% endblock %}

{% block content %}
<h1>Edit Admission</h1>

{% if error_message %}
<p style="color:red;">{{ error_message }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Patient ID</label>
    <input type="number" name="patient_id" value="{{ form_data.patient_id }}">

    <label>Case No</label>
    <input type="text" name="case_no" value="{{ form_data.case_no }}">

    <label>Admission Date and Time</label>
    <input type="datetime-local" name="admission_date_time" value="{{ form_data.admission_date_time }}">

    <label>Admitting Doctor ID</label>
    <input type="number" name="admitting_doctor_id" value="{{ form_data.admitting_doctor_id }}">

    <label>Initial Diagnosis</label>
    <textarea name="initial_diagnosis">{{ form_data.initial_diagnosis }}</textarea>

    <label>Ward Room ID</label>
    <input type="number" name="ward_room_id" value="{{ form_data.ward_room_id }}">

    <label>Admission Source</label>
    <select name="admission_source">
        <option value="">-- Select --</option>
        <option value="Emergency" {% if form_data.admission_source == "Emergency" %}selected{% endif %}>Emergency</option>
        <option value="Outpatient" {% if form_data.admission_source == "Outpatient" %}selected{% endif %}>Outpatient</option>
        <option value="Referral" {% if form_data.admission_source == "Referral" %}selected{% endif %}>Referral</option>
        <option value="Transfer" {% if form_data.admission_source == "Transfer" %}selected{% endif %}>Transfer</option>
        <option value="Walk-in" {% if form_data.admission_source == "Walk-in" %}selected{% endif %}>Walk-in</option>
    </select>

    <label>Chief Complaint</label>
    <textarea name="chief_complaint">{{ form_data.chief_complaint }}</textarea>

    <br><br>
    <button type="submit">Save Changes</button>
</form>

<hr>

<form method="POST"
      action="{% url 'admission_delete' admission_id %}"
      onsubmit="return confirm('Are you sure you want to delete this admission?');">
    {% csrf_token %}

    <button type="submit" style="background-color:red; color:white;">
        Delete Admission
    </button>
</form>

<br>
<a href="{% url 'admission_list' %}">Go Back</a>

{% endblock %}
