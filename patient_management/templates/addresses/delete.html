{% extends "base.html" %}

{% block title %}Delete Address{% endblock %}

{% block content %}

<h1>Delete Address</h1>

<p>
Are you sure you want to delete this address?
</p>

<p>
<strong>{{ address.street_subdivision }}, {{ address.city_municipality }}</strong>
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" style="background-color:red; color:white;">
        Yes, Delete
    </button>
</form>

<br>
<a href="{% url 'address_list' %}">Cancel</a>

{% endblock %}
