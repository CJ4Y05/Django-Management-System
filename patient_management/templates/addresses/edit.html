{% extends "base.html" %}

{% block title %}Edit Address{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Address</h2>

    {% if error_message %}
        <div class="alert alert-danger">{{ error_message }}</div>
    {% endif %}

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Patient ID</label>
            <input type="number" name="patient_id" class="form-control" value="{{ form_data.patient_id }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Address Type</label>
            <select name="address_type" class="form-select">
                <option value="">-- Select --</option>
                <option value="Permanent" {% if form_data.address_type == "Permanent" %}selected{% endif %}>Permanent</option>
                <option value="Current" {% if form_data.address_type == "Current" %}selected{% endif %}>Current</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Street / Subdivision</label>
            <input type="text" name="street_subdivision" class="form-control" value="{{ form_data.street_subdivision }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Barangay</label>
            <input type="text" name="barangay" class="form-control" value="{{ form_data.barangay }}">
        </div>

        <div class="mb-3">
            <label class="form-label">City / Municipality</label>
            <input type="text" name="city_municipality" class="form-control" value="{{ form_data.city_municipality }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Province</label>
            <input type="text" name="province" class="form-control" value="{{ form_data.province }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Zip Code</label>
            <input type="text" name="zip_code" class="form-control" value="{{ form_data.zip_code }}">
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'address_list' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
    </form>

    <div class="mt-3 text-end">
        <a href="{% url 'address_delete' address_id %}" class="btn btn-danger">Delete Address</a>
    </div>
</div>
{% endblock %}
