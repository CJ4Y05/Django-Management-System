{% extends "base.html" %}

{% block title %}Create Address{% endblock %}

{% block content %}

<h1>Create Address</h1>

{% if error_message %}
<p style="color:red;">{{ error_message }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Patient ID</label>
    <input type="number" name="patient_id" value="{{ form_data.patient_id }}">

    <label>Address Type</label>
    <select name="address_type">
        <option value="">-- Select --</option>
        <option value="Permanent" {% if form_data.address_type == "Permanent" %}selected{% endif %}>Permanent</option>
        <option value="Current" {% if form_data.address_type == "Current" %}selected{% endif %}>Current</option>
    </select>

    <label>Street / Subdivision</label>
    <input type="text" name="street_subdivision" value="{{ form_data.street_subdivision }}">

    <label>Barangay</label>
    <input type="text" name="barangay" value="{{ form_data.barangay }}">

    <label>City / Municipality</label>
    <input type="text" name="city_municipality" value="{{ form_data.city_municipality }}">

    <label>Province</label>
    <input type="text" name="province" value="{{ form_data.province }}">

    <label>Zip Code</label>
    <input type="text" name="zip_code" value="{{ form_data.zip_code }}">

    <br><br>
    <button type="submit">Save Address</button>
</form>

<br>
<a href="{% url 'address_list' %}">Go Back</a>

{% endblock %}
