{% extends "base.html" %}

{% block title %}Edit Allergy{% endblock %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4">Edit Allergy</h2>

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Allergen</label>
            <input type="text" name="allergen" class="form-control" value="{{ form_data.allergen }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Severity</label>
            <select name="reaction_severity" class="form-select">
                <option value="Mild" {% if form_data.reaction_severity == "Mild" %}selected{% endif %}>Mild</option>
                <option value="Moderate" {% if form_data.reaction_severity == "Moderate" %}selected{% endif %}>Moderate</option>
                <option value="Severe" {% if form_data.reaction_severity == "Severe" %}selected{% endif %}>Severe</option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'allergy_list' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
    </form>

    <div class="mt-3 text-end">
        <a href="{% url 'allergy_delete' allergy_id %}" class="btn btn-danger">Delete</a>
    </div>

</div>
{% endblock %}
