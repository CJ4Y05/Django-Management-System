{% extends "base.html" %}

{% block title %}Create Allergy{% endblock %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4">Create Allergy</h2>

    {% if error_message %}
        <div class="alert alert-danger">
            {{ error_message }}
        </div>
    {% endif %}

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Patient ID</label>
            <input type="number" name="patient_id" class="form-control" value="{{ form_data.patient_id }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Allergen</label>
            <input type="text" name="allergen" class="form-control" value="{{ form_data.allergen }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Reaction Severity</label>
            <select name="reaction_severity" class="form-select">
                <option value="">-- Select --</option>
                <option value="Mild" {% if form_data.reaction_severity == "Mild" %}selected{% endif %}>Mild</option>
                <option value="Moderate" {% if form_data.reaction_severity == "Moderate" %}selected{% endif %}>Moderate</option>
                <option value="Severe" {% if form_data.reaction_severity == "Severe" %}selected{% endif %}>Severe</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Symptoms</label>
            <textarea name="symptoms" class="form-control">{{ form_data.symptoms }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Recorded Date</label>
            <input type="date" name="recorded_date" class="form-control" value="{{ form_data.recorded_date }}">
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'allergy_list' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Save</button>
        </div>

    </form>

</div>
{% endblock %}
