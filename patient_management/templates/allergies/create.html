{% extends "base.html" %}

{% block title %}Create Allergy{% endblock %}

{% block content %}
<h1>Create Allergy</h1>

{% if error_message %}
<p style="color:red;">{{ error_message }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Patient ID</label>
    <input type="number" name="patient_id" value="{{ form_data.patient_id }}">

    <label>Allergen</label>
    <input type="text" name="allergen" value="{{ form_data.allergen }}">

    <label>Reaction Severity</label>
    <select name="reaction_severity">
        <option value="">-- Select --</option>
        <option value="Mild" {% if form_data.reaction_severity == "Mild" %}selected{% endif %}>Mild</option>
        <option value="Moderate" {% if form_data.reaction_severity == "Moderate" %}selected{% endif %}>Moderate</option>
        <option value="Severe" {% if form_data.reaction_severity == "Severe" %}selected{% endif %}>Severe</option>
    </select>

    <label>Symptoms</label>
    <textarea name="symptoms">{{ form_data.symptoms }}</textarea>

    <label>Recorded Date</label>
    <input type="date" name="recorded_date" value="{{ form_data.recorded_date }}">

    <br><br>
    <button type="submit">Save Allergy</button>
</form>

<br>
<a href="{% url 'allergy_list' %}">Go Back</a>

{% endblock %}
