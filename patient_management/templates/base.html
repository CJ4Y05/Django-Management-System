<style>

/* Remove default spacing on everything */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'poppins', Arial, sans-serif;
}

/* Gradient shift animation for topbar */
@keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Fade + slide-up animation for content */
@keyframes fadeSlideIn {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Top bar */
.topbar {
    background: linear-gradient(120deg, #1a5c2e, #2e9e5b, #1a7a45, #0f4d25);
    background-size: 300% 300%;
    animation: gradientShift 6s ease infinite;
    color: white;
    padding: 14px 24px;
    font-size: 20px;
    font-weight: bold;
}

/* Sidebar + content sit side by side */
.wrapper {
    display: flex;
    min-height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 180px;
    background: linear-gradient(180deg, #1e7a40 0%, #155c2e 100%);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

/* Sidebar section label */
.sidebar-label {
    color: #a8f0c4;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 12px 8px 6px;
}

/* Sidebar links */
.sidebar a {
    color: white;
    text-decoration: none;
    padding: 9px 12px;
    border-radius: 5px;
    font-size: 14px;
    display: block;
    transition: background-color 0.2s ease;
}

.sidebar a:hover {
    background-color: #0f4d25;
}

/* Main content area */
.content {
    flex: 1;
    padding: 28px;
    background: linear-gradient(160deg, #f0f8f2 0%, #e8f5ec 100%);
    animation: fadeSlideIn 0.45s ease both;
}

.actions-col {
    width: 1%;
    white-space: nowrap;
}


</style>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head> 
<body>
     <!-- Top bar -->
    <div class="topbar">
        <h1>Patient Management</h1>
    </div>

    <!-- Wrapper holds sidebar + content side by side -->
    <div class="wrapper">

        <!-- Sidebar -->
        <div class="sidebar">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'patient_list' %}">Patients</a>
            <a href="{% url 'address_list' %}">Addresses</a>
            <a href="{% url 'emergencycontact_list' %}">Contacts</a>
            <a href="{% url 'guardian_list' %}">Guardian</a>
            <a href="{% url 'admission_list' %}">Admissions</a>
            <a href="{% url 'allergy_list' %}">Allergies</a>
        </div>

        <!-- Main content — each page fills this -->
        <div class="content">
            {% block content %}
            
            {% endblock %}
        </div>

    </div>

    
</body>
</html>
