{% extends "base.html" %}
{% block title %}Add Insurance Info{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Add Insurance Info</h2>

    {% if error_message %}
        <div class="alert alert-danger">{{ error_message }}</div>
    {% endif %}

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Patient ID</label>
                <input type="text" name="patient_id" class="form-control" value="{{ form_data.patient_id }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Provider Type</label>
                <select name="provider_type" class="form-select">
                    <option value="">-- Select --</option>
                    <option value="PhilHealth" {% if form_data.provider_type == "PhilHealth" %}selected{% endif %}>PhilHealth</option>
                    <option value="HMO"        {% if form_data.provider_type == "HMO"        %}selected{% endif %}>HMO</option>
                    <option value="Private"    {% if form_data.provider_type == "Private"    %}selected{% endif %}>Private</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">PhilHealth No</label>
                <input type="text" name="philhealth_no" class="form-control" value="{{ form_data.philhealth_no }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">HMO Name</label>
                <input type="text" name="hmo_name" class="form-control" value="{{ form_data.hmo_name }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Policy Number</label>
                <input type="text" name="policy_number" class="form-control" value="{{ form_data.policy_number }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Is Active</label>
                <select name="is_active" class="form-select">
                    <option value="">-- Select --</option>
                    <option value="Yes" {% if form_data.is_active == "Yes" %}selected{% endif %}>Yes</option>
                    <option value="No"  {% if form_data.is_active == "No"  %}selected{% endif %}>No</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Coverage Limit</label>
                <input type="number" name="coverage_limit" class="form-control" value="{{ form_data.coverage_limit }}">
            </div>

        </div>

        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'insuranceinfo_list' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Save Insurance</button>
        </div>

    </form>
</div>
{% endblock %}
